workflows:
  ios-workflow:
    name: GoPro Stretch Build
    instance_type: mac_mini_m1
    max_build_duration: 30
    scripts:
      - name: Initialize App Structure
        script: |
          # Создаем структуру проекта Xcode на лету
          mkdir -p GoProApp/Base.lproj
          mv ContentView.swift GoProApp/
          mv Info.plist GoProApp/
      - name: Build Unsigned IPA
        script: |
          # Собираем без подписи, чтобы не платить за сертификат
          xcodebuild -archivePath $CM_BUILD_DIR/GoPro.xcarchive \
            -allowProvisioningUpdates \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ING_REQUIRED=NO \
            archive
    artifacts:
      - $CM_BUILD_DIR/*.ipa
