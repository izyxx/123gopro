workflows:
  ios-swiftui-workflow:
    name: iOS SwiftUI Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      groups:
        - sdk
      vars:
        XCODE_PROJECT: "GoProStretch.xcodeproj"
        XCODE_SCHEME: "GoProStretch"
    scripts:
      - name: Generate Xcode project
        script: | 
          # Используем swift-sh или простую команду для генерации проекта из файлов
          swift package init --type executable
          # Мы просто скажем системе собрать наш файл как основной
          mv ContentView.swift main.swift 
      - name: Build IPA
        script: | 
          xcodebuild build -sdk iphoneos -configuration Release
    artifacts:
      - build/reports/**
      - *.ipa
