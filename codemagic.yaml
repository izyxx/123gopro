workflows:
  ios-swiftui-workflow:
    name: iOS SwiftUI Build
    instance_type: mac_mini_m1
    scripts:
      - name: Compile Swift Binary
        script: |
          # Компилируем файл в исполняемый бинарник
          swiftc ContentView.swift -o GoproTool
      - name: Create Dummy IPA
        script: |
          # Создаем структуру папок для IPA
          mkdir -p Payload/GoproTool.app
          cp GoproTool Payload/GoproTool.app/
          cp Info.plist Payload/GoproTool.app/
          zip -r GoproTool.ipa Payload
    artifacts:
      - "*.ipa"
