workflows:
  ios-swiftui-workflow:
    name: iOS SwiftUI Build
    instance_type: mac_mini_m1
    scripts:
      - name: Build App
        script: |
          # Собираем проект через стандартный инструмент Apple
          xcrun swift build -c release --triple arm64-apple-ios15.0-macabi
      - name: Package IPA
        script: |
          mkdir -p Payload/GoProStretch.app
          cp .build/arm64-apple-ios15.0-macabi/release/GoProStretch Payload/GoProStretch.app/
          cp Info.plist Payload/GoProStretch.app/
          zip -r GoProStretch.ipa Payload
    artifacts:
      - "*.ipa"
