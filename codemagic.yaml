workflows:
  ios-workflow:
    name: GoPro Stretch Build
    instance_type: mac_mini_m1
    max_build_duration: 30
    scripts:
      - name: Build Library
        script: |
          swift build -c release --triple arm64-apple-ios15.0
      - name: Create IPA Structure
        script: |
          mkdir -p Payload/GoProStretch.app
          # Копируем скомпилированный файл (имя может отличаться, проверим)
          find .build -name "GoProStretch" -type f -exec cp {} Payload/GoProStretch.app/ \;
          cp Info.plist Payload/GoProStretch.app/
          zip -r GoProStretch.ipa Payload
    artifacts:
      - "*.ipa"
